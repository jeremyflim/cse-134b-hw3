<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Jeremy Lim | 404 Page Not Found</title>
    <link rel="stylesheet" href="css/styles.css">

    <style>
      main{max-width:56.25rem;margin:6rem auto;padding:1rem;text-align:center}
      .notfound{background:linear-gradient(180deg,#111 0%, #0b0f1a 100%);padding:3rem;border-radius:0.75rem;color:var(--text);box-shadow:0 0.625rem 2.5rem rgba(0,0,0,.6)}
      .notfound h1{font-size:3rem;margin:0 0 1rem}
      .notfound p{color:var(--muted);margin:0 0 1.25rem}
      .notfound a{display:inline-block;margin-top:1rem}
    </style>

  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Home">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="40" stroke="var(--muted)" stroke-width="4" fill="var(--accent)" />
        </svg>
      </a>
    </header>

    <main>
      <section class="notfound">
        <h1>404 :(</h1>
        <p>Sorry the page you were going to doesn't exist!</p>
        <p>If you reached this by clicking a broken link on this site, please contact me to fix it!</p>
        <p><a class="cta" href="index.html">Return home</a></p>
      </section>
    </main>

  </body>
</html>
