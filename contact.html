<body>
  <header>
    <a href="index.html">
      <svg width="100" height="100">
        <circle cx="50" cy="50" r="40"
        stroke="black" stroke-width="4" fill="orange" />

      </ul>
    </nav>
  </header>

  <main>
    <h1>Get in Touch!</h1>

    <section aria-label="Contact Form">
      <h2>Contact form</h2>

      <form action="#" method="post">
        <fieldset>
          <legend>Send a message</legend>

          <label for="name">Name</label>
          <input id="name" name="name" type="text" required maxlength="100">

          <label for="email">Email</label>
          <input id="email" name="email" type="email" required maxlength="50">

          <label for="message">Message</label>
          <textarea id="message" name="message" required maxlength="2000"></textarea>

          <div>
            <button type="submit">Send</button>
            <progress value="0" max="100">0%</progress>
          </div>

        </fieldset>
      </form>
    </section>

    <section aria-label="Alternative Contact Methods">
      <h2>Or:</h2>
      <ul>
        <li><a href="mailto:jel125@ucsd.edu">Email</a></li>
        <li><a href="https://linkedin.com/in/jeremyflim">LinkedIn</a></li>
        <li><a>Phone Number Here</a></li>
      </ul>
    </section>

  </main>

  <footer>
    <nav aria-label="Footer links">
      <ul>
        <li><a href="mailto:jel125@ucsd.edu">email</a></li>
        <li><a href="https://linkedin.com/in/jeremyflim" title="LinkedIn">linkedin</a></li>
        <li><a href="https://github.com/jeremyflim" title="GitHub">github</a></li>
        <li><a href="experiments.html">experiments</a></li>
      </ul>
    </nav>
  </footer>

  <noscript>
    <p>JavaScript disabled. But again. No javascript. Even though the form needs it.</p>
  </noscript>
</body>
</html>
